<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10283c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>棚卸スキャナー</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><header><h1>棚卸スキャナー</h1><span id="status">準備中</span></header><main><section class="panel"><h2>連続カメラスキャン</h2><div class="camera"><video id="video" autoplay playsinline muted></video><div class="roi"><span>商品番号の四角い枠をここに合わせる</span></div></div><div class="controls"><button id="start">カメラ開始</button><button id="stop" class="secondary" disabled>停止</button><button id="flip" class="secondary">カメラ切替</button></div><p class="hint">印刷された四角い商品番号枠を、緑のガイド内に合わせてください。背景のバーコード番号や手書き数字は対象外です。</p><p class="hint" id="scanInfo">同じ番号は、枠から一度外して再び映すと追加できます。</p><div class="controls"><label>認識間隔 <select id="interval"><option value="350">高速（0.35秒）</option><option value="650" selected>標準（0.65秒）</option><option value="1200">省電力（1.2秒）</option></select></label><label><input id="sound" type="checkbox" checked> 登録時に振動</label></div></section><section class="panel"><h2>手動登録・修正</h2><div class="controls"><input id="manual" inputmode="text" placeholder="例：0012-345-678" aria-label="商品番号"><button id="add">追加</button></div><p class="hint">ハイフン・空白などを除去し数字のみ保存。先頭の0は維持します。</p></section><section class="panel"><div class="heading"><h2>棚卸リスト</h2><select id="sort" aria-label="並び順"><option value="asc">数字順 ↑</option><option value="desc">数字順 ↓</option></select></div><div class="stats"><span id="kinds">0種類</span><span id="total">合計0点</span></div><div class="controls"><button id="export" class="secondary">CSV出力</button><button id="clear" class="danger">全件削除</button></div><div id="list" class="list"></div></section><p class="hint">データはこの端末のブラウザ内に保存されます。Safariのサイトデータを削除すると消えるため、定期的にCSVを保存してください。</p></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script><script src="app.js?v=3" defer></script></body></html>
